name: Build Nara APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Unpack app files
        run: unzip -q www.zip
      - name: Setup Capacitor project
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/status-bar@6 capacitor-native-biometric@4
          npx cap init "Nara" com.nara.money --web-dir www
          npx cap add android
          node -e "const f=require('fs'),p=f.existsSync('capacitor.config.json')?'capacitor.config.json':null;if(p){const c=JSON.parse(f.readFileSync(p));c.plugins={StatusBar:{overlaysWebView:true,backgroundColor:'#00000000',style:'DARK'}};f.writeFileSync(p,JSON.stringify(c,null,2))}"
          sed -i 's#</style>#<item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item></style>#' android/app/src/main/res/values/styles.xml
          npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Nara-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
